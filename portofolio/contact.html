<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio Saya - Contact</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav>
        <div class="container nav-container">
            <div class="logo">MyPortofolio</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
                <li><button id="theme-toggle" class="btn-theme">🌙 Mode Gelap</button></li>
            </ul>
        </div>
    </nav>

    <section class="page-section">
        <div class="container">
            <h2>Hubungi Saya</h2>
            <p>Silakan isi formulir di bawah ini untuk mengirimkan pesan atau penawaran kerja sama.</p>
            
            <form id="contact-form" class="contact-form">
                <div class="form-group">
                    <label for="name">Nama Lengkap:</label>
                    <input type="text" id="name" placeholder="Masukkan nama Anda">
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" placeholder="contoh@email.com">
                </div>
                <div class="form-group">
                    <label for="message">Pesan:</label>
                    <textarea id="message" rows="5" placeholder="Tuliskan pesan Anda..."></textarea>
                </div>
                <button type="submit" class="btn">Kirim Pesan</button>
            </form>
            <div id="form-feedback" class="feedback-msg"></div>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 MyPortofolio. All Rights Reserved.</p>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
